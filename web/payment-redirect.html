<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Payment...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
            color: #333;
        }
        .container {
            text-align: center;
            padding: 24px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 16px;
            border: 3px solid #e0e0e0;
            border-top-color: #FF5722;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { margin: 0; font-size: 16px; color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Payment processed. Returning to app...</p>
    </div>
    <script>
        (function() {
            try {
                // Parse all URL search params (Xendit appends status, etc.)
                var params = {};
                var queryString = window.location.search.substring(1);
                if (queryString) {
                    var pairs = queryString.split('&');
                    for (var i = 0; i < pairs.length; i++) {
                        var pair = pairs[i].split('=');
                        if (pair[0]) {
                            params[decodeURIComponent(pair[0])] = decodeURIComponent(pair[1] || '');
                        }
                    }
                }

                // Send structured message to the opener window (main app)
                if (window.opener && window.opener !== window) {
                    window.opener.postMessage({
                        type: 'payment_redirect',
                        url: window.location.href,
                        params: params,
                        timestamp: Date.now()
                    }, '*');
                }

                // Auto-close this popup after a short delay to ensure message is received
                setTimeout(function() {
                    window.close();
                }, 1500);
            } catch (e) {
                console.error('[PaymentRedirect] Error:', e);
                // Fallback: if anything fails, show a manual close message
                document.body.innerHTML = '<div class="container"><p>Payment completed. You can close this window.</p></div>';
            }
        })();
    </script>
</body>
</html>
