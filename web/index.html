  <script>
    (function prefetchHomeData() {
      // ApiCacheManager key prefix (see api_cache_manager.dart:63)
      var PREFIX = 'app_api_cache_box_';
      // Default TTL is 3 minutes (180000ms)
      var TTL = 3 * 60 * 1000;
      var endpoints = [
        { url: 'https://api.joyminis.com/api/v1/banners?bannerCate=1&limit=10', key: 'home_banners_cache_v1' },
        { url: 'https://api.joyminis.com/api/v1/home/sections?limit=10',        key: 'home_treasures_cache_v1' },
        { url: 'https://api.joyminis.com/api/v1/treasure/hot-groups?limit=10',   key: 'home_group_buying_cache_v1' },
      ];

      // Fire-and-forget: data lands in localStorage before Flutter boots.
      // If fetches fail, normal SWR cache-miss path takes over — no harm done.
      endpoints.forEach(function(ep) {
        fetch(ep.url, { cache: 'no-store' })
          .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function(data) {
            var now = Date.now();
            var envelope = JSON.stringify({
              data: data,
              cachedAt: now,
              expiresAt: now + TTL,
            });
            try { localStorage.setItem(PREFIX + ep.key, envelope); } catch (e) {}
          })
          .catch(function() {});
      });
    })();
  </script>

<script>
    // ===== App Shell Removal Strategy =====
    //
    // Problem: FLUTTER-VIEW appears in DOM before Flutter has actually rendered
    // content (Firebase init, runApp, providers all need time). Polling for
    // canvas/renderer elements is unreliable across Flutter Web rendering modes.
    //
    // Solution: Show App Shell for a generous fixed duration (4s from page load)
    // which covers typical Flutter engine initialization (WASM download + Firebase
    // + first frame). Also expose __removeAppShell() so Flutter can call it
    // precisely via JS interop when truly ready — eliminating the gap entirely.

    var _appShellStart = Date.now();

    // Exposed for Flutter JS interop: call window.__removeAppShell() from Dart
    // (e.g., in HomePage's first frame) for gap-free transition.
    window.__removeAppShell = function() {
        var loader = document.getElementById('joymini-loader');
        if (loader) {
            loader.style.transition = "opacity 0.5s ease-out";
            loader.style.opacity = "0";
            setTimeout(function() { if (loader.parentNode) loader.remove(); }, 500);
        }
    };

    // Fallback: watch for Flutter engine DOM nodes, then wait a fixed duration
    // before removing App Shell. No polling — just a reliable timer.
    const observer = new MutationObserver(function(mutations) {
        for (let mutation of mutations) {
            if (mutation.addedNodes.length > 0) {
                for (let node of mutation.addedNodes) {
                    if (node.tagName === 'FLUTTER-VIEW' ||
                        node.tagName === 'FLT-GLASS-PANE' ||
                        node.tagName === 'FLT-SCENE-HOST') {

                        observer.disconnect();

                        // Keep App Shell visible for at least 2.5s from page load.
                        // This gives Flutter time to finish engine init + first frame.
                        // The JS interop __removeAppShell() call from Dart handles the
                        // exact timing; this is just a fallback for slow engine loads.
                        var elapsed = Date.now() - _appShellStart;
                        var delay = Math.max(0, 2500 - elapsed);

                        setTimeout(function() {
                            window.__removeAppShell();
                        }, delay);

                        return;
                    }
                }
            }
        }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Absolute safety: remove after 10s regardless of Flutter state.
    setTimeout(function() {
        window.__removeAppShell();
    }, 10000);
</script>

<!-- ===== H3: Lazy cache deferred .part.js files (after Flutter is interactive) ===== -->
<script>
    // Deferred .part.js files are NOT cached during SW install to avoid competing
    // with main.dart.js download. Instead, cache them lazily when the browser is idle,
    // triggered by __removeAppShell() — which means Flutter engine is fully loaded.
    //
    // Why requestIdleCallback: ensures we don't steal bandwidth/CPU from the critical
    // first-frame rendering. The browser calls this when the main thread is idle.
    // Fallback to setTimeout(5s) for browsers without requestIdleCallback support.
    (function initDeferredPartCaching() {
        // The original __removeAppShell
        var _origRemove = window.__removeAppShell;
        window.__removeAppShell = function() {
            // Call original first (removes App Shell)
            if (_origRemove) _origRemove();

            // Then lazily cache deferred .part.js files for second-visit speed.
            function cacheParts() {
                if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.controller.postMessage({ type: 'CACHE_PARTS' });
                }
            }
            if ('requestIdleCallback' in window) {
                requestIdleCallback(cacheParts, { timeout: 5000 });
            } else {
                setTimeout(cacheParts, 5000);
            }
        };
    })();
</script>

<script>
    // Capture install prompt for manual triggering later
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        // Expose to Flutter via js channel if needed
        window.__pwaInstallReady = true;
        console.log('[PWA] Install prompt ready');
    });

    window.addEventListener('appinstalled', () => {
        deferredPrompt = null;
        window.__pwaInstalled = true;
        console.log('[PWA] App installed successfully');
    });

    // Allow Flutter to trigger install prompt via JS interop
    window.triggerPwaInstall = function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((result) => {
                console.log('[PWA] User choice:', result.outcome);
                deferredPrompt = null;
            });
            return true;
        }
        return false;
    };

    // Allow Flutter to apply a waiting SW update before reloading.
    // Some SWs require an explicit skipWaiting message; plain reload is not enough.
    window.applyPwaUpdate = function() {
        if (!('serviceWorker' in navigator)) {
            window.location.reload();
            return true;
        }

        navigator.serviceWorker.getRegistration('/').then((reg) => {
            if (reg && reg.waiting) {
                const waiting = reg.waiting;
                const done = () => {
                    window.__pwaUpdateReady = false;
                    window.location.reload();
                };

                navigator.serviceWorker.addEventListener('controllerchange', done, { once: true });

                // Compatible with common SW conventions.
                try { waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (_) {}
                try { waiting.postMessage('skipWaiting'); } catch (_) {}

                // Fallback to avoid being stuck if controllerchange is not fired.
                setTimeout(done, 1500);
            } else {
                window.__pwaUpdateReady = false;
                window.location.reload();
            }
        }).catch(() => {
            window.__pwaUpdateReady = false;
            window.location.reload();
        });

        return true;
    };

    // Let Flutter trigger a manual SW update check in debug/support flows.
    window.forcePwaUpdateCheck = function() {
        if (!('serviceWorker' in navigator)) {
            window.__pwaUpdateReady = false;
            return false;
        }

        navigator.serviceWorker.getRegistration('/').then((reg) => {
            if (!reg) {
                window.__pwaUpdateReady = false;
                return;
            }

            reg.update()
                .then(() => {
                    window.__pwaUpdateReady = !!reg.waiting;
                })
                .catch(() => {
                    // Keep previous state on transient failures.
                });
        });

        return true;
    };
</script>

<script>
    // Dev environment (localhost): skip SW registration entirely.
    // The SW itself skips fetch handling for localhost, but reg.update()
    // and flutter_service_worker.js registration still trigger false
    // "new version" detection on every rebuild.
    if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        console.log('[PWA] Dev mode detected, skipping SW registration');
    } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/pwa_sw.js', { scope: '/' })
                .then((reg) => {
                    console.log('[PWA] SW registered, scope:', reg.scope);

                    const syncUpdateReady = () => {
                        const hasWaitingWorker = !!reg.waiting;
                        window.__pwaUpdateReady = hasWaitingWorker;
                        if (hasWaitingWorker) {
                            console.log('[PWA] New version available (waiting worker)');
                        }
                    };

                    // Listen for SW lifecycle changes during this session.
                    reg.addEventListener('updatefound', () => {
                        const newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', () => {
                            // installed + existing controller means update is ready for activation.
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                window.__pwaUpdateReady = true;
                            }
                            syncUpdateReady();
                        });
                    });

                    // Defer background update check by 30 seconds.
                    // This prevents false "new version" detection on fresh page loads
                    // from external redirects (e.g. payment gateway return), where
                    // a leftover waiting worker or cache discrepancy would immediately
                    // trigger the banner on the deposit result page.
                    setTimeout(function() {
                        reg.update().catch(() => {});
                    }, 30000);

                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        window.__pwaUpdateReady = false;
                    });
                })
                .catch((err) => console.warn('[PWA] SW registration failed:', err));
        });
    }
</script>

<!-- ===== PWA: Flutter SW Update Listener (supplement) ===== -->
<script>
    // Also listen for Flutter's built-in service worker updates.
    // This ensures we catch updates even if the custom SW doesn't change.
    // Skip in dev mode (localhost) to avoid false "new version" detection.
    if (!(window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('/flutter_service_worker.js', { scope: '/' })
            .then((reg) => {
                reg.addEventListener('updatefound', () => {
                    window.__pwaUpdateReady = true;
                    console.log('[PWA] Flutter SW update detected');
                });
            })
            .catch(() => {
                // Flutter SW may not exist in dev mode (flutter run), that's fine.
            });
    }
</script>
