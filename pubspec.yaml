name: flutter_app
description: "JoyMini is a mini e-commerce app built with Flutter, designed to demonstrate best practices in mobile development. It features a clean architecture, efficient state management, and a rich set of functionalities including product browsing, shopping cart, and user authentication."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+78

environment:
  sdk: ">=3.10.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # The following adds the Cupertino Icons font to your application.
  easy_localization: ^3.0.5
  
  # Local data storage solution
  shared_preferences: ^2.5.3
  provider: ^6.0.3

  # auto compute screen size
  flutter_screenutil: ^5.9.0

  # json serialization and deserialization solution
  json_annotation: ^4.9.0

  # http client
  http: ^1.5.0
  # http client
  dio: ^5.4.0

  # flutter toast library
  fluttertoast: ^9.0.0

  # svg image
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.0

  # router
  go_router: ^17.0.1
  url_launcher: ^6.3.0

  animations: ^2.1.0
  flutter_animate: ^4.5.0
  visibility_detector: ^0.4.0
  shimmer: ^3.0.0
  syncfusion_flutter_sliders: ^32.1.19
  syncfusion_flutter_core: ^32.1.19
  intl: ^0.20.2
  collection: ^1.19.1
  dartx: ^1.2.0
  flutter_riverpod: ^2.5.0
  card_swiper: ^3.0.1
  jiffy: ^6.4.3
  sliver_tools: ^0.2.12
  infinite_scroll_pagination: ^5.1.1
  extended_nested_scroll_view: ^6.2.1
  pull_to_refresh_notification: ^3.1.1
  easy_debounce: ^2.0.3
  pull_to_refresh: ^2.0.0
  nested_scroll_view_plus: ^3.0.0
  custom_refresh_indicator: ^4.0.1
  flutter_secure_storage: ^10.0.0
  flutter_widget_from_html: ^0.17.1
  reactive_forms: 17.0.1           # 🔙 退回 v17
  reactive_forms_annotations: 5.0.0
  share_plus: ^12.0.1
  qr_flutter: ^4.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  equatable: ^2.0.7
  dismissible_page: ^1.0.2
  flutter_blurhash: ^0.9.1
  flutter_cache_manager: ^3.3.1
  synchronized: ^3.1.0

  device_info_plus: ^12.3.0
  flutter_udid: ^4.1.1
  uuid: ^4.5.2
  gal: ^2.3.2
  permission_handler: ^12.0.1
  camera: ^0.11.3
  flutter_image_compress: ^2.4.0
  google_mlkit_text_recognition: ^0.15.0
  google_mlkit_face_detection: ^0.13.1
  google_api_availability: ^5.0.1
  firebase_performance: ^0.11.1+3
  flutter_slidable: ^4.0.3
  webview_flutter: ^4.10.0
  flutter_countdown_timer: ^4.1.0
  app_links: ^7.0.0
  socket_io_client: ^3.1.3
  bot_toast: ^4.1.3
  jwt_decoder: ^2.0.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.2.0
  firebase_messaging: ^16.1.0
  
  # Facebook Login (iOS native SDK required by Facebook TOS)
  flutter_facebook_auth: ^7.1.1
  rxdart: ^0.28.0
  image_picker: ^1.2.1
  photo_view: ^0.15.0

  sembast: ^3.8.5
  sembast_web: ^2.4.4
  idb_shim: ^2.7.1+2
  record: ^5.1.0 # 建议使用最新稳定版
  just_audio: ^0.10.5
  connectivity_plus: ^7.0.0
  image: ^4.7.2
  video_compress: ^3.1.4
  video_player: ^2.11.0
  cross_file: ^0.3.5+1
  ffmpeg_kit_flutter_new: ^4.1.0
  blurhash: ^1.2.0
  universal_html: ^2.3.0
  file_selector: ^1.0.3        # 替换 file_picker — 官方插件，iOS 用 UIDocumentPickerViewController，无 DKImagePickerController 依赖
  open_filex: ^4.7.0
  geolocator: ^14.0.2
  map_launcher: ^4.4.3
  geocoding: ^4.0.0
  native_dio_adapter: ^1.5.1
  crypto: ^3.0.7
  convert: ^3.1.2
  azlistview: ^2.0.0
  lpinyin: ^2.0.3
  path: ^1.9.1
  flutter_webrtc: ^1.3.0
  app_badge_plus: ^1.2.6
  flutter_background: ^1.3.0+1
  flutter_callkit_incoming: ^3.0.0
  scrollable_positioned_list: ^0.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  web: ^1.1.1
  emoji_picker_flutter: ^4.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # json serialization and deserialization solution
  build_runner: ^2.4.0
  reactive_forms_generator: 5.0.0
  json_serializable: ^6.6.0
  riverpod_generator: ^2.4.0

  # component browser (dev only)
  widgetbook: ^3.18.0

  # native splash screen generation (dev only)
  flutter_native_splash: ^2.4.7

  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"

flutter_native_splash:
  # Light mode: app background color
  color: "#f5f5f5"
  # Dark mode: app background color
  color_dark: "#13161b"
  # Center logo image
  image: assets/images/logo.png
  image_dark: assets/images/logo.png
  # Fill the entire screen (hides status bar during splash)
  fullscreen: true
  # Android 12+ adaptive splash
  android_12:
    color: "#f5f5f5"
    color_dark: "#13161b"
    image: assets/images/logo.png
    image_dark: assets/images/logo.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/images/product_detail/
    - assets/images/payment/
    - assets/images/home_statistics/
    - assets/images/verify/
    - assets/images/tab_bar/
    - assets/locales/en.json
    - assets/locales/tl.json
    - assets/fonts/
    - shorebird.yaml
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  vector_graphics: 1.1.11
  vector_graphics_compiler: 1.1.11
  # 强制使用更旧的接口版本，或者更新的 linux 版本
  # 这里我们强制把 linux 包提上来（假设 1.2.0 是兼容版本）
  record_linux: ^1.2.0
